<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Home · Webview</title>
<style>
:root{color-scheme:light dark;font:15px/1.55 system-ui;background:light-dark(#f3f5f8,#101318);color:light-dark(#18202c,#e8edf6)}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #70809a55;border-radius:10px;padding:8px 13px;background:light-dark(#fff,#252d39);color:inherit}button:disabled{opacity:.4;cursor:default}header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #70809a33;background:light-dark(#fff,#171c24)}header small{color:#8b98aa;margin-left:auto}main{display:grid;grid-template-columns:250px 1fr;height:calc(100dvh - 65px)}aside{padding:16px;border-right:1px solid #70809a33;overflow:auto}#threads{display:grid;gap:7px;margin-top:12px}#threads button{text-align:left;overflow:hidden;text-overflow:ellipsis}#threads .active{border-color:#4996ff;background:#297eff25}section{display:flex;min-height:0;min-width:0;flex-direction:column}#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}.message{max-width:min(88%,1000px);border-radius:17px;padding:14px 18px;background:light-dark(#fff,#202733);overflow-wrap:anywhere}.user{align-self:flex-end;background:#146de9;color:white;white-space:pre-wrap}.assistant{align-self:flex-start}p{margin:6px 0;white-space:pre-wrap}h2{font-size:1.3em;margin:12px 0 6px}.code{border:1px solid #70809a55;border-radius:10px;overflow:hidden;margin:10px 0}.code header{padding:6px 12px;font-size:12px}.code header button{margin-left:auto;font-size:12px;padding:4px 10px}pre{padding:12px;margin:0;overflow:auto;background:light-dark(#eff2f7,#131820);font:13px/1.6 ui-monospace,monospace;white-space:pre}code{font-family:ui-monospace,monospace;background:#70809a25;border-radius:4px;padding:1px 4px}pre code{padding:0;background:none}.table{overflow:auto;margin:10px 0}table{border-collapse:collapse;min-width:100%}td,th{border:1px solid #70809a55;padding:8px 12px;min-width:100px}th{background:#70809a25}details{margin:8px 0;color:light-dark(#506077,#a5b6ce);border:1px solid #70809a44;border-radius:10px;padding:10px}summary{cursor:pointer}.thinking{white-space:pre-wrap;font-size:13px;max-height:350px;overflow:auto}footer{padding:12px 18px;border-top:1px solid #70809a33;background:light-dark(#fff,#171c24)}#state{font-size:12px;color:#8b98aa;margin-bottom:8px}.compose{display:flex;gap:8px;align-items:end}textarea{resize:vertical;min-height:48px;max-height:180px;flex:1;min-width:0;background:transparent;color:inherit;border:1px solid #70809a55;border-radius:12px;padding:10px}#login{max-width:380px;margin:10vh auto;padding:24px;border:1px solid #70809a44;border-radius:18px}input{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #70809a66;background:transparent;color:inherit}.error{color:#ed8b75}a{color:#4996ff}.hidden{display:none!important}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{padding:8px;max-height:120px;border-right:0;border-bottom:1px solid #70809a33}#threads{display:flex;overflow:auto;margin:6px 0}#threads button{flex-shrink:0;max-width:200px}#chat{padding:12px}.message{max-width:96%}header small{font-size:10px}}
</style>
<header><strong>Agent Home</strong><span>Webview</span><button id="contextOpen">◉ Context</button><small id="mode">Đang kết nối…</small></header>
<div id="login" class="hidden"><h2>Đăng nhập</h2><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu Webview" maxlength="256"><button>Đăng nhập</button></form><p id="loginError" class="error"></p><small>HTTP: dùng mạng tin cậy, Tailscale hoặc SSH tunnel.</small></div>
<main id="app" class="hidden"><aside><button id="create">＋ Hội thoại mới</button><div id="threads"></div></aside><section><div id="chat"></div><footer><div id="state">Sẵn sàng</div><form id="compose" class="compose"><textarea id="text" placeholder="Nhắn tin…" maxlength="8000"></textarea><button id="send">Gửi</button><button id="stop" type="button">Dừng</button></form></footer></section></main>
<dialog id="contextDialog" style="max-width:700px;width:92%;max-height:90vh;overflow:auto;border:1px solid #70809a66;border-radius:14px"><button id="ctxClose">Đóng</button><h2>Context & compact</h2><p id="ctxMetrics"></p><h3>Summary đang dùng</h3><pre id="ctxActive" style="white-space:pre-wrap"></pre><h3>Snapshot chờ xem</h3><pre id="ctxPreview" style="white-space:pre-wrap"></pre><p>Compact dùng API có phí; lịch sử gốc được giữ. Xem trước rồi chọn dùng summary. Chưa tự compact.</p><button id="ctxCompact">Compact thủ công</button> <button id="ctxActivate">Dùng summary</button> <button id="ctxDiscard">Bỏ snapshot chờ / hủy</button> <button id="ctxDrop">Bỏ toàn bộ summary</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let settings={},selected='',stream=null,snapshot={},lastPayload='',thinkingOpen=false;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json','X-AH-CSRF':settings.csrf||''},body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Object.assign(Error(data.error||`HTTP ${response.status}`),{status:response.status});return data}
function inline(parent,text){const re=/(\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\))/g;let from=0,m;while((m=re.exec(text))){parent.append(document.createTextNode(text.slice(from,m.index)));let e;if(m[2])e=node('strong',m[2]);else if(m[3])e=node('code',m[3]);else{e=node('a',m[4]);e.href=m[5];e.target='_blank';e.rel='noopener noreferrer'}parent.append(e);from=re.lastIndex}parent.append(document.createTextNode(text.slice(from)))}
function cells(line){let s=line.trim();if(s.startsWith('|'))s=s.slice(1);if(s.endsWith('|'))s=s.slice(0,-1);const out=[];let part='',code=false;for(let i=0;i<s.length;i++){if(s[i]==='\\'&&s[i+1]==='|'){part+='|';i++;continue}if(s[i]==='`')code=!code;if(s[i]==='|'&&!code){out.push(part.trim());part=''}else part+=s[i]}out.push(part.trim());return out}
async function copy(text,button){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const field=node('textarea');field.value=text;document.body.append(field);field.select();if(!document.execCommand('copy'))throw Error('Copy unavailable');field.remove()}button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1500)}catch{button.textContent='Không copy được'}}
function rich(parent,text){const lines=text.split('\n');for(let i=0;i<lines.length;){const line=lines[i];const fence=line.match(/^\s{0,3}(`{3,}|~{3,})(.*)$/);if(fence){const marker=fence[1];let code='';i++;while(i<lines.length&&!new RegExp('^\\s{0,3}'+marker[0]+'{'+marker.length+',}\\s*$').test(lines[i])){code+=lines[i]+(i+1<lines.length?'\n':'');i++}if(i<lines.length)i++;const box=node('div',undefined,'code'),head=node('header'),button=node('button','Copy');button.type='button';head.append(node('span',fence[2].trim()||'Code'),button);button.onclick=()=>copy(code,button);const pre=node('pre');pre.append(node('code',code));box.append(head,pre);parent.append(box);continue}if(i+1<lines.length&&line.includes('|')&&cells(lines[i+1]).every(v=>/^:?-{3,}:?$/.test(v))&&cells(line).length===cells(lines[i+1]).length){const headers=cells(line),align=cells(lines[i+1]),wrap=node('div',undefined,'table'),table=node('table');const row=(items,heading)=>{const tr=node('tr');headers.forEach((_,c)=>{const td=node(heading?'th':'td');inline(td,items[c]||'');td.style.textAlign=align[c].startsWith(':')&&align[c].endsWith(':')?'center':align[c].endsWith(':')?'right':'left';tr.append(td)});table.append(tr)};row(headers,true);i+=2;let count=0;while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()&&count++<200)row(cells(lines[i++]),false);wrap.append(table);parent.append(wrap);continue}const heading=line.match(/^#{1,6}\s+(.+)$/),bullet=line.match(/^\s*[-*+]\s+(.+)$/);const p=node(heading?'h2':'p');inline(p,heading?heading[1]:bullet?'• '+bullet[1]:line);parent.append(p);i++}}
function controls(){const active=['queued','running'].includes(snapshot.state);$('send').disabled=!settings.interactive||!selected||active;$('stop').disabled=!settings.interactive||!active;$('text').disabled=!settings.interactive;$('create').disabled=!settings.interactive}
function showPayload(data){const serialized=JSON.stringify(data);if(serialized===lastPayload)return;lastPayload=serialized;snapshot=data.snapshot||{};const chat=$('chat'),nearBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<90;const items=[];for(const m of data.history.messages){const card=node('div',undefined,'message '+(m.role==='user'?'user':'assistant'));if(m.role==='user')card.textContent=m.content;else rich(card,m.content);items.push(card)}const reasoning=snapshot.reasoning||'';if(reasoning){const details=node('details');details.open=thinkingOpen;details.append(node('summary','Thinking · provider output'),node('div',reasoning,'thinking'));details.ontoggle=()=>thinkingOpen=details.open;items.push(details)}if(['queued','running'].includes(snapshot.state)&&snapshot.partial){const card=node('div',undefined,'message assistant');rich(card,snapshot.partial);items.push(card)}chat.replaceChildren(...items);$('state').textContent=snapshot.state==='failed'?snapshot.result:snapshot.state==='running'?(reasoning&&!snapshot.partial?'Provider đang reasoning…':'Đang trả lời…'):snapshot.state||'Sẵn sàng';controls();if(nearBottom)chat.scrollTop=chat.scrollHeight}
async function select(id){selected=id;lastPayload='';if(stream)stream.close();stream=new EventSource('/api/events?conversation_id='+encodeURIComponent(id));stream.addEventListener('snapshot',event=>{if(selected!==id)return;try{showPayload(JSON.parse(event.data))}catch(error){$('state').textContent=error.message}});stream.onerror=()=>{$('state').textContent='Đang nối lại luồng…'};await list()}
async function list(){const data=await api('/api/conversations');const nodes=data.conversations.map(c=>{const b=node('button',(c.pinned?'★ ':'')+c.title,c.id===selected?'active':'');b.onclick=()=>select(c.id).catch(error=>{ $('state').textContent=error.message });return b});$('threads').replaceChildren(...nodes);return data.conversations}
async function init(){try{settings=await api('/api/status');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('mode').textContent=(settings.public?'CÔNG CỘNG · ':'Có mật khẩu · ')+(settings.interactive?'Tương tác':'Chỉ xem')+' · '+settings.model;const threads=await list();if(threads.length)await select(threads.some(c=>c.id===selected)?selected:threads[0].id);else controls()}catch(error){if(stream)stream.close();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('mode').textContent='Cần đăng nhập';if(error.status!==401)$('loginError').textContent=error.message}}
$('loginForm').onsubmit=async event=>{event.preventDefault();try{await api('/api/login',{password:$('password').value});$('password').value='';$('loginError').textContent='';await init()}catch(error){$('loginError').textContent=error.message}};
$('create').onclick=async()=>{try{const data=await api('/api/create',{});await select(data.id)}catch(error){$('state').textContent=error.message}};
$('compose').onsubmit=async event=>{event.preventDefault();const text=$('text').value.trim();if(!text||!selected)return;const id=Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join('');const body={id,conversation_id:selected,text};$('send').disabled=true;try{try{await api('/api/submit',body)}catch(error){if(error.status)throw error;await api('/api/submit',body)}$('text').value='';snapshot.state='queued';controls()}catch(error){$('state').textContent=error.message;controls()}};
$('stop').onclick=async()=>{try{await api('/api/cancel',{id:snapshot.id})}catch(error){$('state').textContent=error.message}};
$('text').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(!$('send').disabled)$('compose').requestSubmit()}};
setInterval(()=>{if(!$('app').classList.contains('hidden'))list().catch(error=>{if(error.status===401)init()})},5000);init();
let compactSnapshot={},contextTimer=null;
async function contextRefresh(){if(!selected)return;try{compactSnapshot=await api('/api/context?conversation_id='+encodeURIComponent(selected));const c=compactSnapshot;let usage='Provider chưa trả usage';try{usage=JSON.stringify(JSON.parse(c.usage.usage),null,2)}catch{}$('ctxMetrics').textContent=`Context window: ${c.window_tokens} token\nNguồn: ${c.source}\nInput ước lượng: ${c.estimated_input_tokens} / ${c.input_budget_tokens} token (JSON UTF-8 / 3 + overhead, không phải tokenizer)\nOutput: ${c.output_tokens} · Dự trữ an toàn: ${c.reserve_tokens} token\nTin recent ngoài lượt gửi: ${c.omitted_recent}\nUsage API chat gần nhất: ${usage}`;$('ctxActive').textContent=c.active.summary||'Chưa có summary';$('ctxPreview').textContent=`${c.latest.state||'chưa có'} · ${c.latest.before_chars||0} → ${c.latest.after_chars||0} ký tự\n${c.latest.summary||''}\n${c.latest.error||''}`;$('ctxCompact').disabled=!settings.interactive||['running','ready'].includes(c.latest.state);$('ctxActivate').disabled=!settings.interactive||c.latest.state!=='ready';$('ctxDrop').disabled=!settings.interactive}catch(error){$('ctxMetrics').textContent=error.message}}
$('contextOpen').onclick=()=>{if(!selected)return;$('contextDialog').showModal();contextRefresh();clearInterval(contextTimer);contextTimer=setInterval(contextRefresh,2000)};
$('ctxClose').onclick=()=>{$('contextDialog').close();clearInterval(contextTimer)};
async function contextAction(name){try{await api('/api/'+name,{conversation_id:selected,id:compactSnapshot.latest.id||''});await contextRefresh()}catch(error){$('ctxPreview').textContent=error.message}}
$('ctxDiscard').onclick=()=>contextAction('discard');$('ctxCompact').onclick=()=>contextAction('compact');$('ctxActivate').onclick=()=>contextAction('activate');$('ctxDrop').onclick=()=>contextAction('drop');

</script></html>
